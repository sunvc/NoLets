version: 2

project_name: NoLets

builds:
  - id: darwin
    main: .
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    flags:
      - -tags="sonic avx"
    env:
      - CGO_ENABLED=0

  - id: linux
    main: .
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v3
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    flags:
      - -tags="sonic avx"
    env:
      - CGO_ENABLED=0

  - id: windows
    main: .
    goos:
      - windows
    goarch:
      - amd64
    goamd64:
      - v3
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}"
    flags:
      - -tags="sonic avx"
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [ 'tar.gz' ]
    files:
      - src: ./deploy/pushback.p8
        strip_parent: true
      - src: ./deploy/config.yaml
        strip_parent: true
      - LICENSE
      - README.md
      - README_EN.md

release:
  github:
    owner: sunvc
    name: NoLets
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  mode: append
  header: |
    ## 快速安装 (自动识别系统 / 架构)

    Linux / macOS —— 一行下载、解压并运行:

    ```bash
    OS=$(uname -s | tr '[:upper:]' '[:lower:]')
    ARCH=$(uname -m); case "$ARCH" in x86_64|amd64) ARCH=amd64;; aarch64|arm64) ARCH=arm64;; esac
    curl -fsSL "https://github.com/sunvc/NoLets/releases/download/{{ .Tag }}/NoLets_${OS}_${ARCH}.tar.gz" \
      | tar -xz && chmod +x ./NoLets && ./NoLets --config config.yaml
    ```

    Docker 一键部署 (自动装 Docker、拉镜像、健康检查):

    ```bash
    curl -fsSL https://raw.githubusercontent.com/sunvc/nolets/main/install.sh | bash
    ```
  extra_files:
    - glob: ./deploy/pushback.p8
    - glob: ./deploy/config.yaml

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'