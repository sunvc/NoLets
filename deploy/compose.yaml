services:
  NoLets:
    image: sunvc/nolet:latest
    container_name: NoLets
    restart: always
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NOLET_SIGN_KEY= # 加密参数
      - TZ=Asia/Shanghai # 时区 默认 UTC
      - NOLET_AUTHS= #[ADMIN ID 列表]
    # 1. Loki: 日志存储引擎
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 150M # 严格限制内存

  # 2. Promtail: 日志采集器（相当于 Filebeat）
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./logs:/var/log/app # 挂载你的 Gin 和 Nginx 日志目录
      - ./promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml

  # 3. Grafana: 可视化界面
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 200M